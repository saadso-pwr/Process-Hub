services:
  postgres:
    image: postgres:17-alpine
    container_name: process-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: process
      POSTGRES_PASSWORD: process
      POSTGRES_DB: process_hub
    # Host port 5433 to avoid clashing with any local Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - process-hub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U process -d process_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  process-hub-pgdata:
